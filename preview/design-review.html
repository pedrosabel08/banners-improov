<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview de layout — Improov</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f6;color:#20262c;font-family:Arial,Helvetica,sans-serif}.toolbar{display:flex;align-items:end;gap:18px;flex-wrap:wrap;padding:17px 22px;background:#192129;color:#fff}.toolbar h1{width:100%;margin:0;font-size:18px}.field{display:grid;gap:5px;font-size:12px}.field select{min-width:180px;padding:8px;border:1px solid #707b84;border-radius:3px;background:white;color:#192129}.status{margin-left:auto;align-self:center;color:#dbe2e8;font-size:12px}.stage{height:calc(100vh - 112px);min-height:300px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:20px}.stage-bg{position:absolute;inset:112px 0 0;background:linear-gradient(135deg,#e7ebee,#f8f9fa);pointer-events:none}.scale-wrap{position:relative;z-index:1}.scale-wrap iframe{position:absolute;top:0;left:0;border:0;transform-origin:top left;background:#20262c;box-shadow:0 10px 35px #17212a35}.hint{position:absolute;z-index:2;bottom:10px;left:0;right:0;text-align:center;color:#58636d;font-size:12px;pointer-events:none}@media(max-width:700px){.status{width:100%;margin-left:0}.toolbar{gap:10px}.field select{min-width:130px}.stage-bg{inset:176px 0 0}.stage{height:calc(100vh - 176px)}}

const videos=[{"id":"V01","file":"animacao-2-alp-sc-conceito-1080.mp4"},{"id":"V02","file":"animacao-6-aya-kar-piscina-maior-1080.mp4"},{"id":"V03","file":"animacao-gt-lac-tracking-0044-1080.mp4"},{"id":"V04","file":"fg-talls-f-1-1080.mp4"},{"id":"V05","file":"hsa-mon-tracking-0038-lazer-ai-slow-down-1080.mp4"}];const texts=[{"id":"F01","headline":"Você constrói o extraordinário. Faça o mercado perceber.","cta":"Conheça a Improov"},{"id":"F02","headline":"Você investiu em cada detalhe. Mostre por quê.","cta":"Explore os projetos"},{"id":"F03","headline":"Seu projeto é único. A comunicação também deveria ser.","cta":"Veja os projetos"},{"id":"F04","headline":"Antes de construir, faça sentir.","cta":"Explore o portfólio"},{"id":"F05","headline":"Dê ao comercial uma história que vale contar.","cta":"Veja como pensamos"},{"id":"F06","headline":"Quanto vale uma arquitetura que não é percebida?","cta":"Descubra a Improov"}];const sizes=[{"id":"300x250","width":300,"height":250},{"id":"728x90","width":728,"height":90},{"id":"320x480","width":320,"height":480},{"id":"970x250","width":970,"height":250},{"id":"300x600","width":300,"height":600},{"id":"320x100","width":320,"height":100}];const clickTag="https://www.google.com";const logo={"file":"IMPROOV_TOP.gif","alt":"Improov"};const videoHeightOffsets={"V04":80};const creativeCss="/* Base: cada preset abaixo controla independentemente o enquadramento do conteúdo. */\n* {\n  box-sizing: border-box;\n}\nhtml,\nbody {\n  width: 100%;\n  height: 100%;\n  margin: 0;\n  overflow: hidden;\n}\nbody {\n  font-family: Arial, Helvetica, sans-serif;\n}\n.click-through,\n#container {\n  display: block;\n  position: relative;\n  width: 100%;\n  height: 100%;\n  color: #fff;\n}\n.click-through {\n  text-decoration: none;\n}\n#container {\n  overflow: hidden;\n  isolation: isolate;\n  background: #20262c;\n}\n.background-video {\n  position: absolute;\n  z-index: -2;\n  top: calc(0px - var(--format-video-extra-top, 0px) - var(--video-specific-extra-top, 0px));\n  right: 0;\n  bottom: auto;\n  left: 0;\n  width: 100%;\n  height: calc(\n    100% + var(--format-video-extra-top, 0px) + var(--format-video-extra-bottom, 0px) +\n      var(--video-specific-extra-top, 0px) + var(--video-specific-extra-bottom, 0px)\n  );\n  object-fit: cover;\n  object-position: top;\n}\n.brand-logo {\n  /* position: absolute; */\n  z-index: 1;\n  top: var(--logo-offset-top);\n  left: var(--logo-offset-left);\n  width: var(--logo-width);\n  max-height: var(--logo-max-height);\n  object-fit: contain;\n  filter: drop-shadow(0 1px 3px rgb(0 0 0 / 75%));\n}\n#container::after {\n  content: \"\";\n  position: absolute;\n  z-index: -1;\n  inset: 0;\n  background: var(--overlay);\n}\n.content {\n  position: absolute;\n  inset: var(--content-inset);\n  display: flex;\n  flex-direction: var(--flex-direction);\n  justify-content: var(--content-justify);\n  align-items: var(--content-align);\n  gap: var(--content-gap);\n  text-align: var(--text-align);\n}\n.headline {\n  max-width: var(--headline-width);\n  margin: 0;\n  color: #fff;\n  font-size: var(--headline-size);\n  font-weight: 700;\n  line-height: var(--headline-leading);\n  letter-spacing: var(--headline-spacing);\n  text-wrap: pretty;\n  text-shadow: 0 1px 3px rgb(0 0 0 / 32%);\n}\n.cta {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  min-height: var(--cta-height);\n  padding: var(--cta-padding);\n  border: var(--cta-border);\n  border-radius: var(--cta-radius);\n  background: var(--cta-background);\n  color: var(--cta-color);\n  font-size: var(--cta-size);\n  font-weight: 700;\n  line-height: 1;\n  white-space: nowrap;\n}\n\n/* 300x250: formato compacto, conteúdo concentrado na base esquerda. */\n.size-300x250 {\n  --logo-offset-top: -6px;\n  --logo-offset-left: -4px;\n  --logo-width: 112px;\n  --logo-max-height: 32px;\n  --content-inset: 20px;\n  --content-justify: space-between;\n  --content-align: flex-start;\n  --flex-direction: column;\n  --text-align: left;\n  --content-gap: 13px;\n  --headline-width: 260px;\n  --headline-size: 24px;\n  --headline-leading: 1.12;\n  --headline-spacing: -0.35px;\n  --cta-height: 34px;\n  --cta-padding: 0 14px;\n  --cta-size: 12px;\n  --cta-radius: 3px;\n  --cta-border: 0;\n  --cta-background: #fff;\n  --cta-color: #192129;\n  --overlay: linear-gradient(\n    0deg,\n    rgb(0 0 0 / 76%) 0%,\n    rgb(0 0 0 / 35%) 53%,\n    rgb(0 0 0 / 4%) 100%\n  );\n}\n/* 728x90: faixa horizontal com texto e CTA em uma única linha visual. */\n.size-728x90 {\n  --format-video-extra-top: 15px;\n  --format-video-extra-bottom: 15px;\n  --logo-offset-top: -27px;\n  --logo-offset-left: -10px;\n  --logo-width: 100px;\n  --logo-max-height: 24px;\n  --content-inset: 20px 22px;\n  --content-justify: center;\n  --content-align: center;\n  --flex-direction: row;\n  --text-align: left;\n  --content-gap: 12px;\n  --headline-width: 490px;\n  --headline-size: 21px;\n  --headline-leading: 1.08;\n  --headline-spacing: -0.2px;\n  --cta-height: 34px;\n  --cta-padding: 0 13px;\n  --cta-size: 11px;\n  --cta-radius: 3px;\n  --cta-border: 0;\n  --cta-background: #fff;\n  --cta-color: #192129;\n  --overlay: linear-gradient(\n    90deg,\n    rgb(0 0 0 / 77%) 0%,\n    rgb(0 0 0 / 48%) 66%,\n    rgb(0 0 0 / 10%) 100%\n  );\n}\n\n/* 320x480: retrato com margem ampla e texto na base. */\n.size-320x480 {\n  --logo-offset-top: -7px;\n  --logo-offset-left: -7px;\n  --logo-width: 118px;\n  --logo-max-height: 31px;\n  --content-inset: 25px;\n  --content-justify: space-between;\n  --content-align: flex-start;\n  --flex-direction: column;\n  --text-align: left;\n  --content-gap: 17px;\n  --headline-width: 270px;\n  --headline-size: 31px;\n  --headline-leading: 1.1;\n  --headline-spacing: -0.5px;\n  --cta-height: 42px;\n  --cta-padding: 0 17px;\n  --cta-size: 14px;\n  --cta-radius: 3px;\n  --cta-border: 0;\n  --cta-background: #fff;\n  --cta-color: #192129;\n  --overlay: linear-gradient(\n    0deg,\n    rgb(0 0 0 / 80%) 0%,\n    rgb(0 0 0 / 34%) 58%,\n    rgb(0 0 0 / 9%) 100%\n  );\n}\n/* 970x250: faixa ampla; largura generosa para headlines longas. */\n.size-970x250 {\n  --logo-offset-top: -12px;\n  --logo-offset-left: -18px;\n  --logo-width: 132px;\n  --logo-max-height: 34px;\n  --content-inset: 27px 38px;\n  --content-justify: space-between;\n  --content-align: center;\n  --flex-direction: row;\n  --text-align: left;\n  --content-gap: 19px;\n  --headline-width: 710px;\n  --headline-size: 32px;\n  --headline-leading: 1.1;\n  --headline-spacing: -0.55px;\n  --cta-height: 42px;\n  --cta-padding: 0 18px;\n  --cta-size: 14px;\n  --cta-radius: 3px;\n  --cta-border: 0;\n  --cta-background: #fff;\n  --cta-color: #192129;\n  --overlay: linear-gradient(\n    90deg,\n    rgb(0 0 0 / 78%) 0%,\n    rgb(0 0 0 / 43%) 65%,\n    rgb(0 0 0 / 7%) 100%\n  );\n}\n/* 300x600: retrato alto com área de leitura mais ampla. */\n.size-300x600 {\n  --logo-offset-top: -5px;\n  --logo-offset-left: -5px;\n  --logo-width: 124px;\n  --logo-max-height: 32px;\n  --content-inset: 25px;\n  --content-justify: space-between;\n  --content-align: flex-start;\n  --flex-direction: column;\n  --text-align: left;\n  --content-gap: 18px;\n  --headline-width: 250px;\n  --headline-size: 30px;\n  --headline-leading: 1.12;\n  --headline-spacing: -0.45px;\n  --cta-height: 40px;\n  --cta-padding: 0 16px;\n  --cta-size: 13px;\n  --cta-radius: 3px;\n  --cta-border: 0;\n  --cta-background: #fff;\n  --cta-color: #192129;\n  --overlay: linear-gradient(\n    0deg,\n    rgb(0 0 0 / 81%) 0%,\n    rgb(0 0 0 / 37%) 60%,\n    rgb(0 0 0 / 8%) 100%\n  );\n}\n/* 320x100: faixa curta, headline e CTA lado a lado. */\n.size-320x100 {\n  --logo-offset-top: -4px;\n  --logo-offset-left: -1px;\n  --logo-width: 94px;\n  --logo-max-height: 19px;\n  --content-inset: 9px 13px;\n  --content-justify: stretch;\n  --content-align: center;\n  --flex-direction: column;\n  --text-align: left;\n  --content-gap: 0;\n  --headline-width: 205px;\n  --headline-size: 17px;\n  --headline-leading: 1.05;\n  --headline-spacing: -0.1px;\n  --cta-height: 28px;\n  --cta-padding: 0 9px;\n  --cta-size: 9px;\n  --cta-radius: 2px;\n  --cta-border: 0;\n  --cta-background: #fff;\n  --cta-color: #192129;\n  --overlay: linear-gradient(90deg, rgb(0 0 0 / 77%) 0%, rgb(0 0 0 / 38%) 100%);\n}\n.size-320x100 .content {\n  display: grid;\n  grid-template-columns: 110px minmax(0, 1fr);\n  grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);\n  column-gap: 8px;\n  row-gap: 0;\n  justify-content: stretch;\n  align-items: center;\n}\n.size-320x100 .brand-logo {\n  grid-column: 1;\n  grid-row: 1;\n  align-self: center;\n  justify-self: start;\n}\n.size-320x100 .headline {\n  grid-column: 2;\n  grid-row: 1 / span 2;\n  max-width: 100%;\n  align-self: center;\n}\n.size-320x100 .cta {\n  grid-column: 1;\n  grid-row: 2;\n  align-self: center;\n  justify-self: start;\n}\n";
const videoSelect=document.getElementById('video-select');const textSelect=document.getElementById('text-select');const sizeSelect=document.getElementById('size-select');const stage=document.getElementById('stage');const wrap=document.getElementById('scale-wrap');const frame=document.getElementById('creative-frame');
function fillSelect(select,items,label){select.innerHTML=items.map((item)=>'<option value="'+item.id+'">'+item.id+' — '+label(item)+'</option>').join('');}
fillSelect(videoSelect,videos,(item)=>item.file);fillSelect(textSelect,texts,(item)=>item.headline);fillSelect(sizeSelect,sizes,(item)=>item.id);
function escapeHtml(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}
function updatePreview(){const video=videos.find((item)=>item.id===videoSelect.value);const text=texts.find((item)=>item.id===textSelect.value);const size=sizes.find((item)=>item.id===sizeSelect.value);const scale=Math.min((stage.clientWidth-48)/size.width,(stage.clientHeight-48)/size.height,1);wrap.style.width=Math.round(size.width*scale)+'px';wrap.style.height=Math.round(size.height*scale)+'px';frame.style.width=size.width+'px';frame.style.height=size.height+'px';frame.style.transform='scale('+scale+')';document.getElementById('status').textContent=video.id+' · '+text.id+' · '+size.id;const halfVideoOffset=(videoHeightOffsets[video.id]||0)/2;const creative='<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width='+size.width+',initial-scale=1"><meta name="ad.size" content="width='+size.width+',height='+size.height+'"><script>var clickTag='+JSON.stringify(clickTag)+';<\/script><style>'+creativeCss+'</style></head><body class="size-'+size.id+'" style="--video-specific-extra-top:'+halfVideoOffset+'px;--video-specific-extra-bottom:'+halfVideoOffset+'px"><a class="click-through" href="javascript:window.open(window.clickTag)" aria-label="'+escapeHtml(text.headline+' — '+text.cta)+'"><div id="container"><video class="background-video" autoplay muted loop playsinline aria-hidden="true"><source src="../rendered-videos/'+video.id+'_'+size.id+'.mp4" type="video/mp4"></video><div class="content"><img class="brand-logo" src="../source/assets/'+escapeHtml(logo.file)+'" alt="'+escapeHtml(logo.alt)+'"><h1 class="headline">'+escapeHtml(text.headline)+'</h1><span class="cta">'+escapeHtml(text.cta)+'</span></div></div></a></body></html>';frame.srcdoc=creative;}
for(const control of [videoSelect,textSelect,sizeSelect])control.addEventListener('change',updatePreview);window.addEventListener('resize',updatePreview);updatePreview();
</script></body></html>
