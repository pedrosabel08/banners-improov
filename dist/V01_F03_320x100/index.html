<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=320, initial-scale=1" />
    <meta name="ad.size" content="width=320,height=100" />
    <title>V01_F03_320x100</title>
    <script type="text/javascript">
      var clickTag = "https://improov.com.br/";
    </script>
    <style type="text/css">
      /* Base: cada preset abaixo controla independentemente o enquadramento do conteúdo. */
* {
  box-sizing: border-box;
}
html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}
body {
  font-family: Arial, Helvetica, sans-serif;
}
.click-through,
#container {
  display: block;
  position: relative;
  width: 100%;
  height: 100%;
  color: #fff;
}
.click-through {
  text-decoration: none;
}
#container {
  overflow: hidden;
  isolation: isolate;
  background: #20262c;
}
.background-video {
  position: absolute;
  z-index: -2;
  top: calc(0px - var(--format-video-extra-top, 0px) - var(--video-specific-extra-top, 0px));
  right: 0;
  bottom: auto;
  left: 0;
  width: 100%;
  height: calc(
    100% + var(--format-video-extra-top, 0px) + var(--format-video-extra-bottom, 0px) +
      var(--video-specific-extra-top, 0px) + var(--video-specific-extra-bottom, 0px)
  );
  object-fit: cover;
  object-position: top;
}
.brand-logo {
  position: relative;
  z-index: 1;
  top: var(--logo-offset-top);
  left: var(--logo-offset-left);
  width: var(--logo-width);
  max-height: var(--logo-max-height);
  object-fit: contain;
  filter: drop-shadow(0 1px 3px rgb(0 0 0 / 75%));
  opacity: 0;
  transform: translateY(8px);
  animation: logo-entry 0.65s ease-out 0.15s both;
}
@keyframes logo-entry {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
#container::after {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  background: var(--overlay);
}
.content {
  position: absolute;
  inset: var(--content-inset);
  display: flex;
  flex-direction: var(--flex-direction);
  justify-content: var(--content-justify);
  align-items: var(--content-align);
  gap: var(--content-gap);
  text-align: var(--text-align);
}
.headline {
  max-width: var(--headline-width);
  margin: 0;
  color: #fff;
  font-size: var(--headline-size);
  font-weight: 700;
  line-height: var(--headline-leading);
  letter-spacing: var(--headline-spacing);
  text-wrap: pretty;
  text-shadow: 0 1px 3px rgb(0 0 0 / 32%);
}
.headline-sequence {
  display: flex;
  flex-direction: column;
  gap: 0.08em;
}
.headline-phrase {
  display: block;
  opacity: 0;
  transform: translateY(8px);
  animation: headline-reveal 0.65s ease-out var(--phrase-delay, 0s) both;
}
@keyframes headline-reveal {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@media (prefers-reduced-motion: reduce) {
  .brand-logo {
    opacity: 1;
    transform: none;
    animation: none;
  }
  .headline-phrase {
    opacity: 1;
    transform: none;
    animation: none;
  }
}
.cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: var(--cta-height);
  padding: var(--cta-padding);
  border: var(--cta-border);
  border-radius: var(--cta-radius);
  background: var(--cta-background);
  color: var(--cta-color);
  font-size: var(--cta-size);
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
}


/* 320x100: faixa curta, headline e CTA lado a lado. */
.size-320x100 {
  --logo-offset-top: -4px;
  --logo-offset-left: -1px;
  --logo-width: 94px;
  --logo-max-height: 19px;
  --content-inset: 9px 13px;
  --content-justify: stretch;
  --content-align: center;
  --flex-direction: column;
  --text-align: left;
  --content-gap: 0;
  --headline-width: 205px;
  --headline-size: 17px;
  --headline-leading: 1.05;
  --headline-spacing: -0.1px;
  --cta-height: 28px;
  --cta-padding: 0 9px;
  --cta-size: 9px;
  --cta-radius: 2px;
  --cta-border: 0;
  --cta-background: #fff;
  --cta-color: #192129;
  --overlay: linear-gradient(90deg, rgb(0 0 0 / 77%) 0%, rgb(0 0 0 / 38%) 100%);
}
.size-320x100 .content {
  display: grid;
  grid-template-columns: 110px minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
  column-gap: 8px;
  row-gap: 0;
  justify-content: stretch;
  align-items: center;
}
.size-320x100 .brand-logo {
  grid-column: 1;
  grid-row: 1;
  align-self: center;
  justify-self: start;
}
.size-320x100 .headline {
  grid-column: 2;
  grid-row: 1 / span 2;
  max-width: 100%;
  align-self: center;
}
.size-320x100 .cta {
  grid-column: 1;
  grid-row: 2;
  align-self: center;
  justify-self: start;
}

    </style>
  </head>
  <body class="size-320x100" style="width: 320px; height: 100px; --video-specific-extra-top: 0px; --video-specific-extra-bottom: 0px">
    <a
      class="click-through"
      href="javascript:window.open(window.clickTag, '_blank')"
      aria-label="Seu projeto é único. A comunicação também deveria ser. — Veja os projetos"
    >
      <div id="container">
        <video
          class="background-video"
          autoplay
          muted
          playsinline
          aria-hidden="true"
        >
          <source src="video.mp4" type="video/mp4" />
        </video>
        <div class="content">
          <img class="brand-logo" src="logo.png" alt="Improov" />
          <h1 class="headline headline-sequence"><span class="headline-phrase" style="--phrase-delay: 0s">Seu projeto é único.</span><span class="headline-phrase" style="--phrase-delay: 0.9s">A comunicação também deveria ser.</span></h1>
          <span class="cta">Veja os projetos</span>
        </div>
      </div>
    </a>
  </body>
</html>
